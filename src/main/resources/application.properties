spring.application.name=desafio-itau

# Nao expor detalhes internos em respostas de erro
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Janela (em segundos) usada por GET /estatistica. Padrao do enunciado: 60.
# Sobrescreva com a variavel de ambiente ESTATISTICA_JANELA_SEGUNDOS.
estatistica.janela-segundos=60

# Observabilidade (Spring Boot Actuator)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=desafio-itau
info.app.description=API de transacoes e estatisticas (desafio Itau)

# Logs
logging.level.tiago.reiz.desafioitau=INFO

# Documentacao da API (springdoc-openapi)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
